[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-sop"
version = "0.10.0"
description = "Fast rule-based SQL linter. Pre-commit hook + GitHub Action + CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Pawan Singh Kapkoti" }]
keywords = [
    "sql",
    "linter",
    "static-analysis",
    "pre-commit",
    "github-action",
    "sarif",
    "dbt",
    "sql-server",
    "devtools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "sqlparse>=0.5.0",
    "pyyaml>=6.0",
]

# Rendered by PyPI as the "Project links" sidebar. Without this block the
# sidebar shows nothing, so the project page offers no route to the source,
# the issue tracker or the changelog.
[project.urls]
Homepage = "https://github.com/Pawansingh3889/sql-sop"
Source = "https://github.com/Pawansingh3889/sql-sop"
Issues = "https://github.com/Pawansingh3889/sql-sop/issues"
Changelog = "https://github.com/Pawansingh3889/sql-sop/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Pawansingh3889/sql-sop#readme"

[project.scripts]
sql-sop = "sql_guard.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "libcst>=1.1.0", "sqlalchemy>=2.0"]
# Kept as a no-op extra for backwards-compat with `pip install "sql-sop[structural]"`
# in existing requirements files; sqlparse is now a core dependency.
structural = []
python = ["libcst>=1.1.0"]
# `schema-snapshot` introspects a live database via SQLAlchemy.
snapshot = ["sqlalchemy>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["sql_guard"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# typer.Option/typer.Argument in parameter defaults is the framework's own idiom.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# Deliberately unsafe code: it exists so the scanner can flag it.
"tests/fixtures/*" = ["UP031", "UP032"]
