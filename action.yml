name: 'sql-sop'
description: 'Fast rule-based SQL linter. 43 rules covering DELETE-without-WHERE, SQL injection, performance traps, T-SQL anti-patterns, and contract drift.'
author: 'Pawan Singh Kapkoti'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  paths:
    description: 'Files or directories to check'
    required: false
    default: '.'
  severity:
    description: 'Minimum severity to report (error or warning)'
    required: false
    default: 'warning'
  fail-fast:
    description: 'Stop after first error'
    required: false
    default: 'false'
  include-python:
    description: 'Also scan .py files for SQL strings in execute() / read_sql() / sqlalchemy.text() calls'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    # Inputs are passed through `env:` and read as quoted shell variables.
    # Interpolating `${{ inputs.* }}` directly into a `run:` block would
    # splice caller-supplied text into the script before bash sees it, so a
    # workflow feeding untrusted data (a pull request title, say) into an
    # input could run arbitrary commands on the runner.
    - name: Install sql-sop
      shell: bash
      env:
        INCLUDE_PYTHON: ${{ inputs.include-python }}
      run: |
        if [ "$INCLUDE_PYTHON" = "true" ]; then
          pip install "sql-sop[python]"
        else
          pip install sql-sop
        fi
    - name: Run sql-sop
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        SEVERITY: ${{ inputs.severity }}
        FAIL_FAST: ${{ inputs.fail-fast }}
        INCLUDE_PYTHON: ${{ inputs.include-python }}
      run: |
        # `paths` accepts several space-separated entries, so it is split on
        # whitespace only, never re-parsed as shell syntax.
        read -r -a path_args <<< "$PATHS"
        args=(check "${path_args[@]}" --severity "$SEVERITY")
        if [ "$FAIL_FAST" = "true" ]; then
          args+=(--fail-fast)
        fi
        if [ "$INCLUDE_PYTHON" = "true" ]; then
          args+=(--include-python)
        fi
        sql-sop "${args[@]}"
